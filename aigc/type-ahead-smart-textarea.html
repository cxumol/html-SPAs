<!DOCTYPE html><html lang="en"><head>
  <meta name="viewport" content="width=device-width, initial-scale=1" /><meta charset="utf-8" />
  <title>Smart Textarea with AI Completion</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
  <style>
    body{max-width:90%;margin:auto;padding:0;}
    header,footer{text-align:center;}
    .CodeMirror{border:1px solid #ddd;height:60vh;font-size:16px;}
    footer p{margin-top:1rem;color:#888;}
    .CodeMirror-hints{background:#eee;color:silver;border:0px solid #555;}
    li.CodeMirror-hint-active{background:#efefef;color:gray;}
  </style>
</head><body>
  <header>
    <h1>Smart Textarea</h1>
    <p>AI-powered text completion. Just start typing and wait a moment.</p>
  </header>
  <main>
    <section>
      <form><textarea id="editor"># Welcome to the Smart Textarea!

Start typing, and after a brief pause, an AI will suggest a completion.

For example, try typing a famous quote like "To be or not to be" and see what happens.

- Press Tab or Enter to accept a suggestion.
- Press Esc to dismiss it.
- Completions are triggered when you stop typing at the end of a line with enough context.
</textarea></form>
    </section>
  </main>
  <footer>
    <p>Status: <b id="status">Idle</b></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  <script>
    // --- Utils & Config ---
    var $=id=>document.getElementById(id);
    var debounce=(f,d)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),d)}};
    var log=console.log;

    var API_KEY='sk-zxauhinxpdxjohzxvabqvvrrdzrrkenclweafbyvscqlwxke',API_URL='https://api.siliconflow.cn/v1/completions',MODELS=['Qwen/Qwen2-7B-Instruct','THUDM/glm-4-9b-chat','Qwen/Qwen2.5-7B-Instruct','THUDM/GLM-4-9B-0414','internlm/internlm2_5-7b-chat','Qwen/Qwen2.5-Coder-7B-Instruct'];
    var modelIndex=0;

    var statusEl=$('status');
    var cache=new Map();
    var typingState={lastPromptText:null,lastCompletions:[],
      update(p,c){this.lastPromptText=p;this.lastCompletions=c},
      reset(){this.lastPromptText=null;this.lastCompletions=[]}
    };
    var isGettingAIHint=false; // Lock to prevent concurrent network requests.
    var hintPromiseResolve=null; // For managing debounced async hint logic.

    // --- Core Logic ---
    var getNextModel=()=>{var m=MODELS[modelIndex];modelIndex=(modelIndex+1)%MODELS.length;return m;};

    var getAIHintCore=async(cm)=>{
      if(isGettingAIHint)return null;

      var cursor=cm.getCursor();
      var prefix=cm.getRange({line:0,ch:0},cursor);

      if(typingState.lastPromptText&&prefix.startsWith(typingState.lastPromptText)){
        const typedText=prefix.substring(typingState.lastPromptText.length);
        const followUps=typingState.lastCompletions.filter(c=>c.startsWith(typedText)).map(c=>c.substring(typedText.length)).filter(c=>c);
        if(followUps.length>0){statusEl.textContent='Follow-up';return{list:followUps,from:cursor,to:cursor};}
      }
      typingState.reset();

      if(cache.has(prefix)){
        const cached=cache.get(prefix);
        if(cached){statusEl.textContent='Cached';typingState.update(prefix,[cached]);return{list:[cached],from:cursor,to:cursor};}
      }
      
      var model=getNextModel();
      isGettingAIHint=true;
      statusEl.textContent=`Fetching from ${model.split('/')[1]}...`;
      try{
        const res=await fetch(API_URL,{method:'POST',headers:{'Authorization':`Bearer ${API_KEY}`,'Content-Type':'application/json'},
          body:JSON.stringify({model,prompt:prefix,max_tokens:10,temperature:0.2,stop:['\n','\n\n']})
        });
        if(!res.ok)throw new Error(`API Error: ${res.statusText}`);
        const data=await res.json();
        const completion=data.choices&&data.choices[0]?data.choices[0].text.trim():null;
        
        if(!completion){statusEl.textContent='No completion found.';return null;}
        cache.set(prefix,completion);
        typingState.update(prefix,[completion]);
        statusEl.textContent='Ready';
        return{list:[completion],from:cursor,to:cursor};
      }catch(err){
        log(err);statusEl.textContent=`Error: ${err.message}`;return null;
      }finally{
        isGettingAIHint=false;
      }
    };
    
    var debouncedHintPerformer=debounce(async cm=>{
        if(hintPromiseResolve){
            var result=await getAIHintCore(cm);
            hintPromiseResolve(result);
            hintPromiseResolve=null;
        }
    },500); // Debounce hint updates.

    var getAIHint=(cm)=>{ // wrapper to really debounce
        // If a previous hint request is still debouncing, cancel it.
        if(hintPromiseResolve)hintPromiseResolve(null);
        // Return a new promise. The debounced function will resolve it later.
        return new Promise(resolve=>{
            hintPromiseResolve=resolve;
            debouncedHintPerformer(cm);
        });
    };

    var triggerCompletion=cm=>{
      if(cm.state.completionActive)return;
      var cursor=cm.getCursor(),prefix=cm.getRange({line:0,ch:0},cursor),lineSuffix=cm.getLine(cursor.line).substring(cursor.ch);
      if(prefix.trim().length<10){statusEl.textContent='Idle (more context needed)';return;}
      if(lineSuffix.trim().length>0){statusEl.textContent='Idle (cursor not at EOL)';return;}
      cm.showHint({hint:CodeMirror.hint.ai});
    };

    // --- Initialization ---
    CodeMirror.registerHelper('hint','ai',getAIHint);
    var editor=CodeMirror.fromTextArea($('editor'),{
      lineNumbers:false,mode:null,lineWrapping:true,
      extraKeys:{'Ctrl-Space':'autocomplete'},
      hintOptions:{completeSingle:false,async:true}
    });

    var initialTrigger=debounce(triggerCompletion,500);
    editor.on('cursorActivity',initialTrigger); // Use 'cursorActivity' for a slightly smarter trigger
    statusEl.textContent='Ready';
  </script>
</body></html>
