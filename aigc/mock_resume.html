<!DOCTYPE html><html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock a Resume</title>
  <style>
    body { font-family: sans-serif; }
    #container { display: flex; flex-direction: column; align-items: center; width: 80%; margin: 0 auto; }
    input, button { margin: 10px; padding: 8px; }
    iframe { width: 100%; height: 500px; border: 1px solid #ccc; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/mvp.css">
</head>
<body>
  <div id="container">
    <h1>Mock a Resume</h1>
  <textarea id="api-config" rows="3">{"base": "https://api.example/v1",
  "key": "sk-",
  "model": "gpt"}</textarea>
    <div style="display:flex;">
      <input type="text" id="name" placeholder="Enter name">
      <input type="text" id="jobTitle" placeholder="Enter job title (optional)">
      <button id="generateBtn" onclick="generateResume();">Generate Resume</button>
    </div>
    <iframe id="AIGC" srcdoc=""></iframe>
    <button id="downloadBtn" onclick="downloadPDF();" style="display:none">Print / export to PDF</button>
  </div>

  <script>
    var el=(id)=>document.getElementById(id);
    function generateResume() {
      var name = el('name').value, job = el('jobTitle').value;
      var prompt = `Generate a mock resume in printer-firendly HTML format for ${name}${job ? ` with the job title of ${job}` : ''}.`;
      // var API="api.freechat.cnai.me/v1",SK="sk-",model="gpt-4o-mini";
      var apiConf=JSON.parse($('api-config').value||'{}');if(!apiConf?.model || apiConf?.model==="gpt")alert("api key missing!");
      fetch(apiConf.base+'/chat/completions', {method: 'POST', 
        headers: { 'Authorization': 'Bearer '+apiConf.key, 'Content-Type': 'application/json' },
        body: JSON.stringify({model: apiConf.model, messages: [{ role: 'user', content: prompt }] })
      }).then(r => r.json()).then(data => { 
        el('AIGC').srcdoc = data.choices[0].message.content.match(/<.*>/gs)[0];
        el('downloadBtn').style.display='block';
      }).catch(err => {
        console.error('Error generating resume:', err);
        el('AIGC').srcdoc = "something went wrong; try again or try a different AI API";
      });
      el('AIGC').srcdoc = "Be patient when AI is working hard ...";
    };
    function downloadPDF(){window.frames["AIGC"].contentWindow.print()};
  </script>
</body>
</html>
