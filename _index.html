<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" /><meta charset="utf-8" />
  <title>Project Index</title>
  <link rel="stylesheet" type="text/css" href="https://dohliam.github.io/dropin-minimal-css/min/vanilla.min.css">
  <meta name="description" content="An index of all HTML pages in this project." />
</head>
<body onload="renderIndex()">

  <header>
    <h1>cxumol/html</h1>
    <p>A single HTML file is all you need.</p>
  </header>

  <main>
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Description</th>
          <th>Path</th>
          <th>Last Updated</th>
        </tr>
      </thead>
      <tbody id="index-body">
        <tr><td colspan="4"><i>Loading...</i></td></tr>
      </tbody>
    </table>
  </main>

  <!-- This data is automatically generated by a GitHub Action -->
  <script id="index-data" type="application/json">
__JSON_DATA__
  </script>

  <script>
    var $=id=>document.getElementById(id);

    var renderIndex = () => {
      var data = JSON.parse($('index-data').textContent), tableBody = $('index-body');
      if (!data || data.length === 0) return;
      
      tableBody.innerHTML = data.map(page => `
        <tr>
          <td>${page.title || '(No Title)'}</td>
          <td>${page.description || ''}</td>
          <td><a href="${page.path}">${page.path}</a></td>
          <td><time datetime="${page.last_modified}">${new Date(page.last_modified).toLocaleDateString()}</time></td>
        </tr>
      `).join('');
    };
  </script>

</body>
</html>
