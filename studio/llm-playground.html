<!DOCTYPE html><html lang="en"><head>
  <meta name="viewport" content="width=device-width, initial-scale=1" /><meta charset="utf-8" />
  <title>AI Playground</title>
  <style>
    :root{--b:1px solid #000;--bg:#fff;--fg:#000;--h-bg:#eee;--s-w:250px;}
    body{margin:0;font-family:monospace,sans-serif;font-size:14px;background:var(--bg);color:var(--fg);display:flex;height:100vh;overflow:hidden;}
    main{flex-grow:1;display:flex;height:100%;}
    aside{width:var(--s-w);height:100%;border:var(--b);display:flex;flex-direction:column;transition:width .3s,min-width .3s;overflow:hidden;}
    aside.collapsed{width:0;min-width:0;border:none;}
    aside h3{margin:10px 10px 5px;padding-bottom:5px;border-bottom:var(--b);}
    aside .content{padding:0 10px;overflow-y:auto;flex-grow:1;}
    #leftSidebar{border-right:none;} #rightSidebar{border-left:none;}
    #historyList .item{display:flex;justify-content:space-between;align-items:center;padding:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    #historyList .item:hover{background:var(--h-bg);}
    #historyList .item span{flex-grow:1;overflow:hidden;text-overflow:ellipsis;}
    #historyList .del{cursor:pointer;padding:0 5px;font-weight:bold;}
    form label{display:block;margin:10px 0 5px;}
    form input,form select,form textarea{width:100%;box-sizing:border-box;padding:5px;border:var(--b);background:var(--h-bg);}
    .column{flex:1;display:flex;flex-direction:column;height:100%;padding:5px;gap:5px;}
    .panel{display:flex;flex-direction:column;border:var(--b);background:var(--bg);min-height:0;overflow:hidden;}
    #systemPanel{height:25%;}
    #userPanel{flex:1;}
    .panel-header{display:flex;justify-content:space-between;align-items:center;padding:2px 8px;font-weight:bold;border-bottom:var(--b);background:var(--h-bg);flex-shrink:0;}
    textarea, #output{flex-grow:1;padding:8px;border:none;resize:none;background:transparent;outline:none;font-family:inherit;font-size:inherit;overflow-y:auto;}
    #output{white-space:pre-wrap;}
    #output.md>:first-child{margin-top:0;}#output.md>:last-child{margin-bottom:0;}
    #output.md pre{background:#eee;padding:10px;border:var(--b);white-space:pre-wrap;word-break:break-all;}
    #output.md code{background:#eee;padding:0 2px;}#output.md pre code{background:transparent;padding:0;}
    #resizer{height:5px;cursor:ns-resize;background:#ccc;border-top:var(--b);border-bottom:var(--b);flex-shrink:0;}
    button{padding:5px 10px;border:var(--b);background:var(--h-bg);cursor:pointer;}
    button:active{background:#ccc;}
    #sidebarToggles{display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 5px;}
  </style>
</head><body>
<aside id="leftSidebar">
  <h3>History</h3>
  <div class="content" id="historyList"></div>
  <h3>Settings</h3>
  <form class="content" onchange="saveSettings()">
    <label for="provider">Provider</label>
    <select id="provider" onchange="updateEndpoint(this.value)"><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option><option value="gemini">Gemini</option></select>
    <label for="endpoint">Endpoint URL</label>
    <input id="endpoint" type="text" placeholder="API endpoint URL">
    <label for="apiKey">API Key</label>
    <input id="apiKey" type="password" placeholder="sk-...">
    <label><input id="autoSave" type="checkbox"> Auto Save</label>
    <hr style="margin:10px 0; border:none; border-top:var(--b);">
    <button type="button" onclick="newSession()">NEW</button>
  </form>
</aside>
<main>
  <section class="column">
    <div id="systemPanel" class="panel">
      <div class="panel-header">SYSTEM</div>
      <textarea id="systemPrompt" placeholder="System prompt..."></textarea>
    </div>
    <div id="resizer" onmousedown="initDrag(event)"></div>
    <div id="userPanel" class="panel">
      <div class="panel-header">USER</div>
      <textarea id="userPrompt" placeholder="User prompt..."></textarea>
    </div>
  </section>
  <section class="column">
    <div id="outputPanel" class="panel">
      <div class="panel-header">
        <span>ASSISTANT</span>
        <div>
          <button onclick="setOutputView('md')" id="mdBtn" style="background:#ccc">MD</button>
          <button onclick="setOutputView('txt')" id="txtBtn">TXT</button>
          <button onclick="saveSession()">SAVE</button>
          <button onclick="sendRequest()" style="font-weight:bold;">SEND</button>
        </div>
      </div>
      <div id="output"></div>
    </div>
  </section>
</main>
<div id="sidebarToggles">
  <button onclick="toggleSidebar('left')">&lt;</button>
  <button onclick="toggleSidebar('right')">&gt;</button>
</div>
<aside id="rightSidebar">
  <h3>Parameters</h3>
  <form class="content" onchange="saveParams()">
    <label for="model">Model</label>
    <input id="model" type="text" list="models">
    <datalist id="models">
      <option value="gpt-4-turbo"><option value="gpt-4o"><option value="gpt-3.5-turbo">
      <option value="claude-3-opus-20240229"><option value="claude-3-sonnet-20240229"><option value="claude-3-haiku-20240307">
      <option value="gemini-1.5-pro-latest"><option value="gemini-pro">
    </datalist>
    <label for="temperature">Temperature</label>
    <input id="temperature" type="range" min="0" max="2" step="0.1" oninput="this.nextElementSibling.value=this.value">
    <output>0.7</output>
    <label for="max_tokens">Max Tokens</label>
    <input id="max_tokens" type="number" placeholder="e.g., 4096">
    <label><input id="stream" type="checkbox" checked> Stream</label>
  </form>
</aside>
<script>
var $=id=>document.getElementById(id);
var store=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)):localStorage.setItem(k,JSON.stringify(v));
var controller;
var state={currentId:null,sessions:{},settings:{},params:{},view:{outputMode:'md'}};
var providerEndpoints={
  openai:'https://api.openai.com/v1/chat/completions',
  anthropic:'https://api.anthropic.com/v1/messages',
  gemini:'https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:streamGenerateContent'
};

var init=()=>{
  state.settings=Object.assign({provider:'openai',endpoint:providerEndpoints.openai,apiKey:'',autoSave:false},store('settings')||{});
  state.params=Object.assign({model:'gpt-4-turbo',temperature:0.7,max_tokens:4096,stream:true},store('params')||{});
  state.sessions=store('sessions')||{};
  loadSettings();loadParams();renderHistory();
  var lastId=store('lastSessionId');
  if(lastId&&state.sessions[lastId])loadSession(lastId);else newSession();
};
var saveState=()=>{store('settings',state.settings);store('params',state.params);store('sessions',state.sessions);store('lastSessionId',state.currentId);};

var loadSettings=()=>{
  $('provider').value=state.settings.provider;
  $('endpoint').value=state.settings.endpoint;
  $('apiKey').value=state.settings.apiKey;
  $('autoSave').checked=state.settings.autoSave;
};
var saveSettings=()=>{
  state.settings={provider:$('provider').value,endpoint:$('endpoint').value,apiKey:$('apiKey').value,autoSave:$('autoSave').checked};
  saveState();
};
var updateEndpoint=provider=>{
  var el=$('endpoint'),current=el.value;
  if(providerEndpoints[provider]&&(!current||Object.values(providerEndpoints).includes(current)))el.value=providerEndpoints[provider];
  saveSettings();
};

var loadParams=()=>{
  $('model').value=state.params.model;
  $('temperature').value=state.params.temperature;$('temperature').nextElementSibling.value=state.params.temperature;
  $('max_tokens').value=state.params.max_tokens;
  $('stream').checked=state.params.stream;
};
var saveParams=()=>{
  state.params={model:$('model').value,temperature:parseFloat($('temperature').value),max_tokens:parseInt($('max_tokens').value,10)||undefined,stream:$('stream').checked};
  saveState();
};

var newSession=()=>{
  state.currentId='session-'+Date.now();
  $('systemPrompt').value='';$('userPrompt').value='';$('output').innerHTML='';$('output').dataset.raw='';
  state.sessions[state.currentId]={system:'',user:'',assistant:'',ts:Date.now()};
  renderHistory();saveState();
};
var saveSession=()=>{
  if(!state.currentId)return;
  var session={system:$('systemPrompt').value,user:$('userPrompt').value,assistant:$('output').dataset.raw,ts:Date.now()};
  state.sessions[state.currentId]=session;renderHistory();saveState();
};
var loadSession=id=>{
  if(!state.sessions[id])return;
  state.currentId=id;var s=state.sessions[id];
  $('systemPrompt').value=s.system;$('userPrompt').value=s.user;$('output').dataset.raw=s.assistant;
  renderOutput();renderHistory();store('lastSessionId',id);
};
var deleteSession=id=>{
  event.stopPropagation();if(!confirm(`Delete session?`))return;
  delete state.sessions[id];
  if(state.currentId===id)newSession();else{renderHistory();saveState();}
};
var renderHistory=()=>{
  var list=$('historyList');list.innerHTML='';
  Object.entries(state.sessions).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0)).forEach(([id,s])=>{
    var title=s.user.substring(0,25)||'New Session';var item=document.createElement('div');item.className='item';
    item.style.background=id===state.currentId?'#ccc':'transparent';
    item.innerHTML=`<span title="${s.user}">${title}</span><span class="del" onclick="deleteSession('${id}')">X</span>`;
    item.onclick=()=>loadSession(id);list.appendChild(item);
  });
};

var setOutputView=mode=>{
  state.view.outputMode=mode;
  $('mdBtn').style.background=mode==='md'?'#ccc':'transparent';
  $('txtBtn').style.background=mode==='txt'?'#ccc':'transparent';
  renderOutput();
};
var renderOutput=()=>{
  var out=$('output'),raw=out.dataset.raw||'';
  if(state.view.outputMode==='md'){out.className='md';out.innerHTML=mdToHtml(raw);}
  else{out.className='txt';out.textContent=raw;}
  out.scrollTop=out.scrollHeight;
};
var escapeHtml=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
var mdToHtml=text=>{
  if(!text)return'';
  return text.split(/(```[\s\S]*?```)/g).map((part,i)=>{
    if(i%2===1)return`<pre><code>${escapeHtml(part.slice(3,-3).trim())}</code></pre>`;
    part=part.replace(/^(#+) (.*)/gm,(m,h,c)=>`<h${h.length}>${c}</h${h.length}>`)
      .replace(/^((?:\* .*(?:\n|$))+)/gm,m=>`<ul>${m.replace(/^\* (.*)/gm,'<li>$1</li>')}</ul>`)
      .replace(/^((?:^\d+\. .*(?:\n|$))+)/gm,m=>`<ol>${m.replace(/^\d+\. (.*)/gm,'<li>$1</li>')}</ol>`)
      .replace(/<\/ul>\n<ul>/g,'').replace(/<\/ol>\n<ol>/g,'')
      .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,`<code>$1</code>`);
    return part.trim().split(/\n{2,}/).map(block=>{
      if(!block)return'';
      if(/^<(?:h\d|ul|ol)>/.test(block))return block;
      return`<p>${block.replace(/\n/g,'<br>')}</p>`;
    }).join('');
  }).join('');
};

var buildRequest=()=>{
  var{provider,endpoint,apiKey}=state.settings;var{model,temperature,max_tokens,stream}=state.params;
  var system=$('systemPrompt').value,user=$('userPrompt').value;
  var headers={'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`},body;
  if(provider==='openai'){body={model,messages:[...(system?[{role:'system',content:system}]:[]),{role:'user',content:user}],temperature,max_tokens,stream};
  }else if(provider==='anthropic'){headers['x-api-key']=apiKey;headers['anthropic-version']='2023-06-01';body={model,system,messages:[{role:'user',content:user}],temperature,max_tokens,stream};
  }else if(provider==='gemini'){body={contents:[...(system?[{role:'system',parts:[{text:system}]}]:[]),{role:'user',parts:[{text:user}]}],generationConfig:{temperature,maxOutputTokens:max_tokens}};endpoint+=`?key=${apiKey}`;}
  return{url:endpoint,options:{method:'POST',headers,body:JSON.stringify(body),signal:controller.signal}};
};
var sendRequest=async()=>{
  if(controller)controller.abort();controller=new AbortController();
  var out=$('output');out.dataset.raw='';renderOutput();
  try{
    var{url,options}=buildRequest();var res=await fetch(url,options);
    if(!res.ok)throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    if(!state.params.stream||!res.body){var data=await res.json();out.dataset.raw=data.choices[0].message.content;renderOutput();return;}
    var reader=res.body.getReader(),decoder=new TextDecoder();
    while(true){
      var{done,value}=await reader.read();if(done)break;
      var chunk=decoder.decode(value,{stream:true});
      var lines=chunk.split('\n').filter(l=>l.startsWith('data: '));
      for(var line of lines){
        var data=line.substring(6);if(data==='[DONE]')break;
        try{
          var json=JSON.parse(data),delta='';
          if(state.settings.provider==='openai')delta=json.choices[0]?.delta?.content||'';
          else if(state.settings.provider==='anthropic')delta=json.delta?.text||'';
          else if(state.settings.provider==='gemini')delta=json.candidates?.[0]?.content.parts[0].text||'';
          if(delta){out.dataset.raw+=delta;renderOutput();}
        }catch(e){/* Malformed JSON chunk, ignore */}
      }
    }
  }catch(e){if(e.name!=='AbortError')out.dataset.raw=e.toString();renderOutput();}
  finally{if(state.settings.autoSave)saveSession();}
};

var toggleSidebar=side=>{
  var bar=$(side==='left'?'leftSidebar':'rightSidebar');bar.classList.toggle('collapsed');
  var btn=document.querySelector(`#sidebarToggles button:nth-child(${side==='left'?1:2})`);
  btn.textContent=bar.classList.contains('collapsed')?(side==='left'?'>':'<'):(side==='left'?'<':'>');
};
var initDrag=e=>{
  e.preventDefault();var startY=e.clientY,startHeight=$('systemPanel').offsetHeight;
  var doDrag=e=>{var newHeight=startHeight+e.clientY-startY;if(newHeight>20&&newHeight<e.target.parentElement.offsetHeight-20)$('systemPanel').style.height=newHeight+'px';};
  var stopDrag=()=>{document.removeEventListener('mousemove',doDrag);document.removeEventListener('mouseup',stopDrag);};
  document.addEventListener('mousemove',doDrag);document.addEventListener('mouseup',stopDrag);
};
init();
</script>
</body></html>
