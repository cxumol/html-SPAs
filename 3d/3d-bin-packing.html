<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>3D Bin Packing Solver</title>
  <link rel="stylesheet" href="https://dohliam.github.io/dropin-minimal-css/min/yamb.min.css">
  <style>
    main { display: grid; grid-template-columns: 4fr 1fr 6fr; gap: 15px; align-items: flex-start; }
    legend { font-weight: bold; padding: 0 0.5em; }
    .buttons { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 10px; margin-top: 5em;} /* Align buttons below first fieldset */
    textarea { height: 200px; resize: vertical; font-family: monospace; }
    label { font-weight: bold; margin-bottom: 0.2em; display: block; }
    input[type=number] { width: 70px; margin-right: 5px;}
    #viewer { min-height: 600px; border: 1px solid; background-color: #f0f0f0; display: block; width: 100%; position: relative; cursor: pointer;}
    #results { white-space: pre-wrap; padding: 0.5em; border-radius: 4px; margin-bottom: 1em; }
    #packed-items-list { max-height: 150px; overflow-y: auto; }
    #packed-items-list ul { list-style: none; padding: 0; margin: 0; }
    #packed-items-list li { padding: 0.3em 0.5em; border-bottom: 1px solid; cursor: default; transition: background-color 0.1s ease; }
    #packed-items-list li:last-child { border-bottom: none; }
    #packed-items-list li:hover, #packed-items-list li.highlight { background-color: #ff0; } /* Highlight on hover/interaction */
    #packed-items-list span { display: inline-block; margin-right: 5px; }
    .input-group {display: flex; flex-direction: row;}
    .input-group label { display: inline-block; width: auto; margin-right: 5px; } /* Adjust label width */
    .item-format {color: black; margin-bottom: 1em;}
    canvas { display: block; } /* Ensure canvas takes block display */
  </style>
</head>
<body>
  <header><h1>3D Bin Packing Solver</h1></header>
<main>
  <section id="input-section">
    <fieldset>
        <legend>Bin Configuration</legend>
        <label for="binW">Dimensions (W x H x D):</label>
        <div class="input-group">
            <input type="number" id="binW" value="10" min="1">
            <input type="number" id="binH" value="10" min="1">
            <input type="number" id="binD" value="10" min="1">
        </div>
    </fieldset>
    <fieldset>
        <legend>Items to Pack</legend>
        <label for="itemsInput">Items (one per line: W, H, D):</label>
        <div class="item-format">e.g., 5, 4, 3</div>
        <textarea id="itemsInput">
4, 3, 6
2, 2, 2
5, 5, 5
3, 4, 3
1, 5, 2
6, 2, 3
7, 1, 1
        </textarea>
    </fieldset>
     <fieldset>
        <legend>Results and Stats</legend>
        <div id="results">Results will appear here.</div>
        <div id="packed-items-list"></div>
     </fieldset>
  </section>

  <section class="buttons">
    <button onclick="packAndDraw()">Pack Items</button>
    <button onclick="clearAll()">Clear All</button>
  </section>

  <section id="visualization-section">
     <fieldset>
        <legend>3D Visualization</legend>
        <div id="viewer"></div>
     </fieldset>
  </section>
</main>

<!-- Use three.js r160 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<!-- OrbitControls requires being loaded *after* three.js -->
<script type="importmap">{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" } }</script>
<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    // --- UI Helpers ---
    var $=id=>document.getElementById(id);
    // --- Global State ---
    var scene, camera, renderer, controls, binMesh, itemMeshes = [], raycaster, mouse;
    var highlightMaterial = new THREE.MeshStandardMaterial({
        color: 0xffff00, // Yellow highlight
        emissive: 0x555500,
        transparent: true,
        opacity: 0.6,
        metalness: 0,
        roughness: 0.7
    });
    var currentlyHighlighted = { mesh: null, listItem: null };

    // --- Initialization ---
    function initThree() {
        if (renderer) return; // Already initialized
        var container = $('viewer');
        if (!container) { console.error("Viewer container not found"); return; }

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);
        camera = new THREE.PerspectiveCamera(50, container.clientWidth / (container.clientHeight || 600), 0.1, 1000);
        camera.position.set(15, 15, 25);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight || 600);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xcccccc, 0.8));
        var directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
        directionalLight.position.set(1, 1, 0.5).normalize();
        scene.add(directionalLight);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.screenSpacePanning = false;
        controls.addEventListener('change', render);

        // Interaction setup
        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();
        renderer.domElement.addEventListener('mousemove', onMouseMove, false);
        renderer.domElement.addEventListener('mouseleave', onMouseLeave, false); // Clear highlight when leaving canvas

        window.addEventListener('resize', onWindowResize, false);
        onWindowResize();
        animate();
    }

    function onWindowResize() {
        if (!renderer || !camera) return;
        var container = $('viewer');
        var width = container.clientWidth;
        var height = container.clientHeight || 600;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
        render();
    }

    function animate() {
        requestAnimationFrame(animate);
        if (controls) controls.update();
        // Render is called by controls 'change' or interaction events
    }

    function render() {
        if (renderer && scene && camera) renderer.render(scene, camera);
    }

    // --- Bin Packing Logic (FFDH + Rotations - simplified) ---
    function canPlace(bin, packedItems, itemW, itemH, itemD, px, py, pz) {
        if (px < 0 || py < 0 || pz < 0) return false;
        if (px + itemW > bin.w + 1e-6 || py + itemH > bin.h + 1e-6 || pz + itemD > bin.d + 1e-6) return false; // Add tolerance
        for (var packed of packedItems) {
            var p = packed.position;
            var r = packed.rotation;
            if (px < p.x + r.w - 1e-6 && px + itemW > p.x + 1e-6 &&
                py < p.y + r.h - 1e-6 && py + itemH > p.y + 1e-6 &&
                pz < p.z + r.d - 1e-6 && pz + itemD > p.z + 1e-6) return false; // AABB collision
        }
        return true;
    }

    function findBestPosition(bin, packedItems, itemW, itemH, itemD) {
        var bestPos = null;
        var pointsToCheck = [{x:0, y:0, z:0}];
        packedItems.forEach(p => {
            var px = p.position.x, py = p.position.y, pz = p.position.z;
            var rw = p.rotation.w, rh = p.rotation.h, rd = p.rotation.d;
            pointsToCheck.push({x: px + rw, y: py,      z: pz});
            pointsToCheck.push({x: px,      y: py + rh, z: pz});
            pointsToCheck.push({x: px,      y: py,      z: pz + rd});
        });
        pointsToCheck.sort((a, b) => a.y - b.y || a.z - b.z || a.x - b.x); // Lowest-front-leftmost

        var uniquePoints = []; // Avoid checking the exact same point multiple times
        var seenPoints = new Set();
        for(var point of pointsToCheck) {
            var key = `${point.x.toFixed(3)},${point.y.toFixed(3)},${point.z.toFixed(3)}`;
            if (!seenPoints.has(key)) {
                uniquePoints.push(point);
                seenPoints.add(key);
            }
        }

        for (var point of uniquePoints) {
            if (canPlace(bin, packedItems, itemW, itemH, itemD, point.x, point.y, point.z)) {
                return { x: point.x, y: point.y, z: point.z }; // Return first valid position
            }
        }
        return null; // No position found for this orientation
    }

    function packItems(bin, items) {
        var packedItems = [];
        var unpackedItems = [];
        var remainingItems = items.map((item, index) => ({ ...item, originalId: index, packed: false }));
        remainingItems.sort((a, b) => (b.w * b.h * b.d) - (a.w * a.h * a.d)); // Sort by volume desc (FFD)

        for (var item of remainingItems) {
            var placed = false;
            // Try 6 rotations (consider unique ones based on dimensions)
            var rotations = [
                { w: item.w, h: item.h, d: item.d }, { w: item.w, h: item.d, d: item.h },
                { w: item.h, h: item.w, d: item.d }, { w: item.h, h: item.d, d: item.w },
                { w: item.d, h: item.w, d: item.h }, { w: item.d, h: item.h, d: item.w }
            ];
            var uniqueRotations = [];
            var seenDims = new Set();
            for(var rot of rotations){
                var key = [rot.w, rot.h, rot.d].sort().join(',');
                 if(!seenDims.has(key)){
                     uniqueRotations.push(rot);
                     seenDims.add(key);
                 }
            }

            for (var rot of uniqueRotations) {
                var pos = findBestPosition(bin, packedItems, rot.w, rot.h, rot.d);
                if (pos) {
                    packedItems.push({
                        originalId: item.originalId,
                        w: item.w, h: item.h, d: item.d, // Original dimensions
                        rotation: rot, // Packed dimensions/orientation
                        position: pos
                    });
                    item.packed = true;
                    placed = true;
                    break;
                }
            }
            if (!placed) unpackedItems.push(item);
        }
        return { packedItems, unpackedItems };
    }

    // --- Visualization Drawing ---
    function clearScene() {
        if (!scene) return;
        itemMeshes.forEach(mesh => {
            if (mesh.geometry) mesh.geometry.dispose();
            if (mesh.material) {
                // If material is an array
                if (Array.isArray(mesh.material)) {
                    mesh.material.forEach(m => m.dispose());
                } else {
                    mesh.material.dispose();
                }
            }
            scene.remove(mesh);
        });
        itemMeshes = [];
        if (binMesh) {
             if(binMesh.geometry) binMesh.geometry.dispose();
             if(binMesh.material) binMesh.material.dispose();
             scene.remove(binMesh);
             binMesh = null;
        }
        // Clear highlights
        unhighlightCurrent();
        render();
    }

    function drawBin(bin) {
        if (!scene) return;
        var geometry = new THREE.BoxGeometry(bin.w, bin.h, bin.d);
        var edges = new THREE.EdgesGeometry(geometry);
        var material = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 });
        binMesh = new THREE.LineSegments(edges, material);
        binMesh.position.set(bin.w / 2, bin.h / 2, bin.d / 2);
        binMesh.userData.isBin = true; // Mark as bin
        scene.add(binMesh);
    }

    function drawPackedItems(packedItems) {
        if (!scene) return;
        var colorPalette = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff, 0xffa500, 0x800080, 0x008000, 0x800000, 0x000080, 0x808000];

        packedItems.forEach((item) => {
            var geometry = new THREE.BoxGeometry(item.rotation.w, item.rotation.h, item.rotation.d);
            var material = new THREE.MeshStandardMaterial({
                color: colorPalette[item.originalId % colorPalette.length],
                transparent: true,
                opacity: 0.85,
                metalness: 0.1,
                roughness: 0.7
            });
            var mesh = new THREE.Mesh(geometry, material.clone()); // Clone material for highlighting later

            mesh.position.set(
                item.position.x + item.rotation.w / 2,
                item.position.y + item.rotation.h / 2,
                item.position.z + item.rotation.d / 2
            );
            // Store data for interaction
            mesh.userData = {
                isPackedItem: true,
                originalId: item.originalId,
                originalMaterial: material, // Store the original material instance
                dimensions: `${item.w}x${item.h}x${item.d}` // Store original dims for display
            };

            scene.add(mesh);
            itemMeshes.push(mesh);

            // Add edges for better visibility (optional, can add visual clutter)
            var edges = new THREE.EdgesGeometry(geometry);
            var lineMaterial = new THREE.LineBasicMaterial({ color: 0x333333, linewidth: 1 });
            var edgesMesh = new THREE.LineSegments(edges, lineMaterial);
            edgesMesh.position.copy(mesh.position);
            edgesMesh.userData.isPackedItemEdge = true; // Mark to ignore in raycasting if needed
            scene.add(edgesMesh);
            itemMeshes.push(edgesMesh);
        });
    }

    // --- Interaction & Highlighting ---
    function highlightItem(originalId) {
        unhighlightCurrent(); // Unhighlight previous

        // Highlight mesh
        var targetMesh = itemMeshes.find(m => m.userData.isPackedItem && m.userData.originalId === originalId);
        if (targetMesh) {
            targetMesh.material = highlightMaterial;
            currentlyHighlighted.mesh = targetMesh;
            render(); // Update visualization
        }

        // Highlight list item
        var targetListItem = $(`packed-item-${originalId}`);
        if (targetListItem) {
            targetListItem.classList.add('highlight');
            currentlyHighlighted.listItem = targetListItem;
             // Scroll list item into view if needed
            targetListItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        // console.log("Highlighting:", originalId, targetMesh, targetListItem)
    }

    function unhighlightCurrent() {
        // Unhighlight mesh
        if (currentlyHighlighted.mesh) {
            // Revert to its specific original material stored in userData
            currentlyHighlighted.mesh.material = currentlyHighlighted.mesh.userData.originalMaterial;
            currentlyHighlighted.mesh = null;
            render(); // Update visualization
        }
        // Unhighlight list item
        if (currentlyHighlighted.listItem) {
            currentlyHighlighted.listItem.classList.remove('highlight');
            currentlyHighlighted.listItem = null;
        }
         // console.log("Unhighlighting");
    }

    function onMouseMove(event) {
        if (!renderer || itemMeshes.length === 0) return; // Only raycast if items are present

        // Calculate mouse position in normalized device coordinates (-1 to +1)
        var rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        var intersects = raycaster.intersectObjects(itemMeshes, false); // Intersect only packed item meshes

        var intersectedItem = null;
        if (intersects.length > 0) {
            // Find the first mesh that is a packed item
            for(var intersect of intersects){
                if(intersect.object.userData.isPackedItem){
                     intersectedItem = intersect.object;
                     break;
                }
            }
        }

        if (intersectedItem) {
            var originalId = intersectedItem.userData.originalId;
            // Highlight only if it's a different item than currently highlighted
            if (!currentlyHighlighted.mesh || currentlyHighlighted.mesh.userData.originalId !== originalId) {
                highlightItem(originalId);
            }
        } else {
            // If mouse is not over any item, unhighlight
            unhighlightCurrent();
        }
    }
     function onMouseLeave(event) {
         // When mouse leaves the canvas, clear any highlight
         unhighlightCurrent();
     }


    // --- Main Control Functions (Bound to HTML) ---
    window.packAndDraw = function() {
        console.log("Packing started...");
        var startTime = performance.now();
        initThree();
        clearScene();
        $('packed-items-list').innerHTML = ''; // Clear previous list

        // 1. Get Bin Dimensions
        var binW = parseFloat($('binW').value);
        var binH = parseFloat($('binH').value);
        var binD = parseFloat($('binD').value);
        if (isNaN(binW) || isNaN(binH) || isNaN(binD) || binW <= 0 || binH <= 0 || binD <= 0) {
            $('results').textContent = 'Error: Invalid bin dimensions.'; return;
        }
        var bin = { w: binW, h: binH, d: binD };
        var binVolume = binW * binH * binD;

        // 2. Parse Items
        var itemsRaw = $('itemsInput').value.trim().split('\n');
        var items = [];
        var parseErrors = [];
        itemsRaw.forEach((line, index) => {
            if (!line.trim()) return;
            var dims = line.split(/[,;\s]+/).map(Number);
            if (dims.length !== 3 || dims.some(isNaN) || dims.some(d => d <= 0)) {
                parseErrors.push(`Line ${index + 1}: Invalid format or dimensions "${line}"`);
            } else {
                items.push({ w: dims[0], h: dims[1], d: dims[2] });
            }
        });

        if (parseErrors.length > 0) {
            $('results').textContent = 'Error parsing items:\n' + parseErrors.join('\n'); return;
        }
        if (items.length === 0) {
            $('results').textContent = 'No valid items to pack.'; return;
        }

        // 3. Run Packing Algorithm
        var result = packItems(bin, items);
        var endTime = performance.now();
        var calculationTime = (endTime - startTime).toFixed(1);

        // 4. Calculate Stats & Display Results
        var packedVolume = 0;
        result.packedItems.forEach(item => { packedVolume += item.w * item.h * item.d; });
        var volumeEfficiency = binVolume > 0 ? (packedVolume / binVolume * 100).toFixed(2) : 0;

        var resultText = `Packing Complete:\n`;
        resultText += `Packed ${result.packedItems.length} / ${items.length} items.\n`;
        resultText += `Bin Volume: ${binVolume.toFixed(2)} | Packed Volume: ${packedVolume.toFixed(2)}\n`;
        resultText += `Volume Efficiency: ${volumeEfficiency}%\n`;
        resultText += `Calculation Time: ${calculationTime} ms\n`;
        if (result.unpackedItems.length === 0) {
            resultText += `Status: All items placed.\n`;
        } else {
            resultText += `Status: ${result.unpackedItems.length} item(s) could not be placed.\n`;
            // Optionally list unpacked items here or keep it concise
        }
        $('results').textContent = resultText;

        // 5. Visualize
        drawBin(bin);
        drawPackedItems(result.packedItems);

        // 6. Populate Packed Items List
        var listHtml = '<ul>';
        if (result.packedItems.length > 0) {
             result.packedItems.sort((a,b) => a.originalId - b.originalId); // Sort by original ID for consistency
             result.packedItems.forEach(item => {
                 listHtml += `<li id="packed-item-${item.originalId}"
                                  onmouseover="highlightItem(${item.originalId})"
                                  onmouseout="unhighlightCurrent()">`;
                 listHtml += `<span>ID ${item.originalId}:</span> ${item.w} x ${item.h} x ${item.d}`;
                 // Indicate rotation
                 if (item.rotation.w !== item.w || item.rotation.h !== item.h || item.rotation.d !== item.d) {
                      listHtml += ` (packed as ${item.rotation.w}x${item.rotation.h}x${item.rotation.d})`;
                 }
                 listHtml += `</li>`;
             });
        } else {
            listHtml += '<li>No items packed.</li>';
        }
        listHtml += '</ul>';
        $('packed-items-list').innerHTML = listHtml;


        // Adjust camera
        var maxSize = Math.max(bin.w, bin.h, bin.d);
        camera.position.set(bin.w * 1.1, bin.h * 1.3, bin.d * 1.8);
        camera.lookAt(bin.w / 2, bin.h / 2, bin.d / 2);
        if (controls) {
            controls.target.set(bin.w / 2, bin.h / 2, bin.d / 2);
            controls.update();
        }

        render();
        console.log("Packing and drawing finished.");
    }

    window.clearAll = function() {
        console.log("Clearing all...");
        $('binW').value = '10';
        $('binH').value = '10';
        $('binD').value = '10';
        $('itemsInput').value = `4, 3, 6\n2, 2, 2\n5, 5, 5\n3, 4, 3\n1, 5, 2\n6, 2, 3\n7, 1, 1`; // Reset example
        $('results').textContent = 'Results will appear here.';
        $('packed-items-list').innerHTML = '';
        clearScene();
        if (camera) {
             camera.position.set(15, 15, 25);
             camera.lookAt(0, 0, 0);
        }
        if(controls) {
             controls.target.set(0, 0, 0);
             controls.reset();
             controls.update();
        }
        render(); // Render the cleared state
        console.log("Cleared.");
    }

    // Expose interaction functions globally for inline handlers
    window.highlightItem = highlightItem;
    window.unhighlightCurrent = unhighlightCurrent;

    // Initial setup
    initThree();
    render(); // Render the initial empty scene

</script>
</body>
</html>
